name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: |
          chmod +x scripts/*.sh install.sh uninstall.sh
          scripts/build.sh

      - name: Package
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh

      - name: Normalize asset name
        run: |
          cp release/usage-widget-*.tar.gz usage-widget.tar.gz
          shasum -a 256 usage-widget.tar.gz > usage-widget.tar.gz.sha256
          cat usage-widget.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usage-widget
          path: |
            usage-widget.tar.gz
            usage-widget.tar.gz.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            usage-widget.tar.gz
            usage-widget.tar.gz.sha256
          generate_release_notes: true
